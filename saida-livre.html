<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#2b2f35">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Saída Livre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#dfe3e6; --ink:#1f2a33; --muted:#5d6b77; --panel:#ffffff;
  --lot:#3a3e45; --lot2:#34383e; --paint:#f4d35e; --curb:#9aa3ab;
  --red:#e8412c; --btn:#2b2f35; --btnInk:#fff; --lock:#c3c9ce;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1b1f24; --ink:#eef1f3; --muted:#9aa6b0; --panel:#262b31;
    --lot:#2f333a; --lot2:#2a2e34; --curb:#59616a; --btn:#f4d35e; --btnInk:#1b1f24; --lock:#3a4047;
  }
}
:root[data-theme="dark"]{
  --bg:#1b1f24; --ink:#eef1f3; --muted:#9aa6b0; --panel:#262b31;
  --lot:#2f333a; --lot2:#2a2e34; --curb:#59616a; --btn:#f4d35e; --btnInk:#1b1f24; --lock:#3a4047;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Fredoka",ui-rounded,"Segoe UI",system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:3px solid var(--paint);outline-offset:2px}
.screen{display:none;max-width:520px;margin:0 auto;padding:16px}
.screen.on{display:block}

/* menu */
.hero{padding:18px 4px 10px}
.hero h1{margin:0;font-size:clamp(40px,12vw,58px);line-height:.95;font-weight:700;letter-spacing:-.02em}
.hero h1 span{display:block;color:var(--muted);font-weight:500;font-size:.42em;letter-spacing:0;margin-top:10px;line-height:1.3}
.sign{display:inline-flex;align-items:center;gap:8px;background:#1f8a4c;color:#fff;border-radius:8px;
  padding:4px 12px;font-weight:600;font-size:15px;margin-bottom:14px;border:2px solid #fff;box-shadow:0 0 0 2px #1f8a4c}
.cta{display:block;width:100%;margin:16px 0 22px;padding:16px;border-radius:14px;background:var(--btn);color:var(--btnInk);
  font-size:20px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.lv{aspect-ratio:1;border-radius:10px;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:19px;font-weight:600;border:2px solid transparent}
.lv small{font-size:11px;letter-spacing:1px;color:#e0a100;height:13px;line-height:13px}
.lv.next{border-color:var(--red)}
.lv:disabled{background:var(--lock);color:var(--muted);cursor:default}
.tier{grid-column:1/-1;font-size:15px;color:var(--muted);margin:14px 2px 2px;font-weight:500}
.tier:first-child{margin-top:0}

/* game */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.top .back{font-size:17px;font-weight:500;padding:8px 4px}
.top h2{margin:0;font-size:24px;font-weight:700}
.stats{display:flex;gap:10px;justify-content:center;margin:0 0 14px;color:var(--muted);font-size:16px}
.stats b{color:var(--ink);font-weight:600}
.wrap{display:flex;justify-content:center}
.lotbox{position:relative;padding:12px;border-radius:18px;background:var(--curb);
  width:min(100% - 30px, calc(100vh - 290px), 470px);}
.board{position:relative;aspect-ratio:1;border-radius:8px;touch-action:none;
  background:
    repeating-linear-gradient(90deg,transparent 0 calc(100%/6 - 2px),rgba(255,255,255,.18) calc(100%/6 - 2px) calc(100%/6)),
    repeating-linear-gradient(0deg,var(--lot) 0 calc(100%/6),var(--lot2) calc(100%/6) calc(100%/3));}
.exit{position:absolute;right:0;top:calc(12px + (100% - 24px)/3);width:12px;height:calc((100% - 24px)/6);background:var(--lot)}
.exit::after{content:"";position:absolute;left:100%;top:50%;transform:translateY(-50%);border:10px solid transparent;border-left:12px solid var(--red);margin-left:4px}
.car{position:absolute;left:0;transition:transform .16s cubic-bezier(.3,.7,.4,1);will-change:transform;z-index:1}
.car.drag{transition:none;z-index:3}
.car .b{position:absolute;inset:5%;border-radius:22%/34%;background:var(--c);
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.22),0 3px 6px rgba(0,0,0,.35)}
.car.v .b{border-radius:34%/22%}
.car .g{position:absolute;background:rgba(190,225,245,.85);border-radius:4px}
/* horizontal car, facing right */
.car.h .g1{right:17%;top:16%;bottom:16%;width:14%}
.car.h .g2{left:10%;top:18%;bottom:18%;width:10%}
.car.h .r{position:absolute;left:22%;right:33%;top:14%;bottom:14%;border-radius:8px;background:rgba(0,0,0,.12)}
.car.v .g1{top:17%;left:16%;right:16%;height:14%}
.car.v .g2{bottom:10%;left:18%;right:18%;height:10%}
.car.v .r{position:absolute;top:22%;bottom:33%;left:14%;right:14%;border-radius:8px;background:rgba(0,0,0,.12)}
/* trucks */
.car.t.h .g1{right:6%;width:7%} .car.t.h .g2{display:none}
.car.t.h .r{left:6%;right:19%;background:rgba(255,255,255,.2);border-radius:4px}
.car.t.v .g1{top:6%;height:7%} .car.t.v .g2{display:none}
.car.t.v .r{top:19%;bottom:6%;background:rgba(255,255,255,.2);border-radius:4px}
.car.player .b{box-shadow:inset 0 -3px 0 rgba(0,0,0,.22),0 0 0 3px #fff,0 3px 8px rgba(0,0,0,.4)}
.car.hint .b{animation:pulse .8s ease-in-out infinite alternate}
@keyframes pulse{to{box-shadow:0 0 0 4px var(--paint),0 0 18px var(--paint)}}
.ghost{position:absolute;left:0;border:3px dashed var(--paint);border-radius:12px;pointer-events:none;z-index:0;display:none}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.tools button{padding:14px 6px;border-radius:12px;background:var(--panel);font-size:17px;font-weight:500}
.tools button:disabled{opacity:.4}

/* win */
.over{position:fixed;inset:0;background:rgba(15,18,22,.6);display:none;align-items:center;justify-content:center;padding:20px;z-index:9}
.over.on{display:flex}
.card{background:var(--panel);border-radius:20px;padding:24px 22px;width:min(100%,360px);text-align:center}
.card h3{margin:0;font-size:30px}
.stars{font-size:44px;letter-spacing:6px;margin:10px 0 4px;color:#e0a100}
.stars .off{color:var(--lock)}
.card p{color:var(--muted);margin:6px 0 18px;font-size:16px;line-height:1.4}
.card .cta{margin:0 0 10px}
.card .sec{display:block;width:100%;padding:12px;font-size:17px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.car{transition:none}.car.hint .b{animation:none;box-shadow:0 0 0 4px var(--paint)}}
</style>
</head>
<body>
<section class="screen on" id="menu">
  <div class="hero">
    <div class="sign">⬅ SAÍDA</div>
    <h1>Saída Livre<span>Arraste os carros e abra caminho para o vermelho sair do estacionamento.</span></h1>
  </div>
  <button class="cta" id="cont">Jogar</button>
  <div class="grid" id="grid"></div>
</section>

<section class="screen" id="game">
  <div class="top">
    <button class="back" id="back">‹ Níveis</button>
    <h2 id="title">Nível 1</h2>
    <span style="width:64px"></span>
  </div>
  <div class="stats"><span>Movimentos <b id="mv">0</b></span><span>·</span><span>Mínimo <b id="par">0</b></span></div>
  <div class="wrap"><div class="lotbox"><div class="board" id="board"></div><div class="exit"></div></div></div>
  <div class="tools">
    <button id="undo">Desfazer</button>
    <button id="reset">Reiniciar</button>
    <button id="hint">Dica</button>
  </div>
</section>

<div class="over" id="over"><div class="card">
  <h3>Saiu!</h3>
  <div class="stars" id="stars"></div>
  <p id="msg"></p>
  <button class="cta" id="nextBtn">Próximo nível</button>
  <button class="sec" id="again">Jogar de novo</button>
</div></div>
<script>
const LEVELS=[[".C.....C.BBB..FAAI.DF..IGDHH.IG..EE.",2],["......BB.FF...AA.E.G.C.E.G.C...HHHDD",2],["FFF...BBBD...AAD.....D..EE..CC......",2],["MMIIIFEEDDDF..AAH.CBB.HKC.JJ.KGG.LL.",2],["..CC....BB..AAD...FFD......EE.......",2],["GCC..EG....EGAAB.EHDDB..H.FFI.....I.",3],["MMECJJDBECGGDBAAF.D...FLII.HHLKK....",3],["FF.GG.D.IIK.DAA.KJB...KJBHH..CBEE..C",3],[".I.HHH.I...G.AA..GBBEKFFCCEK.LJJ.DDL",3],["......DDDHF..AAHF.CC..GG.EE.....BBB.",3],[".......BBECCAA.E..D..E..D..FF....GG.",4],[".IEDDD.IEB..FAABJCF.GBJC.HG..C.H....",4],["..D...CCD...AAFE....FE.BHHFE.B...GGB",4],["........B..DAABE.D...E....FF.....CCC",4],["HFFF.KHJJB.KHAAB..DD.I.CE..IGCELLLGC",5],[".IHH...I.DD.AA.EB.JJJEB.GG.E.KFFCC.K",5],["HHIFF.LLIBMDGAABMDG.CCM.GJJE..KK.E..",5],["GH.BBBGH.CCCAA..FM.LLLFMDI.EEKDIJJJK",6],["KLLLM.K.DDME.AAG.EII.GFF.CBBB..CJJHH",6],[".EMLL..EMBB.AACG..JJCGDDKKCHHH.FF.II",6],["CDDDMMCG.BBBCGAA.LIII.ELH.JJELHKKFFF",6],[".MHDD..MHCCCI.HAAKIJJLLK.GGBBE...FFE",7],["KK.DD...HHGGJAALFIJEELFIJ.C.M.BBC.M.",7],["...CDD.LLCBHAA.FBHII.FK.GGG.KJMMEEKJ",7],["GKKKMMGJJCCLAA.D.L.IID.HFF.DBH..EEBH",8],["BK.EE.BKJGH.AAJGHDC....DCLLM.DIIIMFF",8],["..D.JJEEDBILAADBIL.MMKKG.HCC.G.H.FFG",8],[".K.CCL.KDDILAA..IBEGGGHBEJ.FHBEJ.FMM",9],["LMIII.LM.FEBAA.FEBJ.DFC.J.D.CG.HHKKG",9],["M..FBBM..FGGE.AADJE.HHDJCCKII...KLLL",9],[".LLDDDEEE.FKAA..FKB.HHH.BIIMMCGG.JJC",10],["HHMM..CBBJ.ECAAJ.EF..JIIF...GKDDLLGK",10],["..HHHJ..DDDJ..AABCMMFFBCKIIEEEKGGLLL",10],["ECCKKKEJJDDDAA.HILBBBHIL.MF.IG.MF..G",11],["LLFFB.CCKKB.AA..BEJD.I.EJDGIHHJDG.MM",11],["IIIJJKFMMM.KF.AAD..BBHD..LLHGGEE.CCC",11],["LI.FF.LIJJKK.AAEM...BEMDGHBCCDGHB...",12],["EELL.I..KHHIAAK..I.DJJFF.DGGBB.MMCCC",12],[".DDDLLBHHJJKBAAM.KI.GM..IEGFFF.EGCC.",12],["MMIIIBJHHHGBJAA.G.J..CFFK..CLLKEEEDD",13],["M..DH.MBBDH.AAI..GLLI..G..JKEEFFJKCC",13],["..C.HHJJC.M.LKAAM.LK.EEEGGII.FBBDDDF",13],[".DD.GBFFF.GBILAAGBILHEE.JCH...JCKK..",13],["KKHHE.FFFBE.AADB...GDBCCLGDIIJLG...J",13],["...IFF.D.IE.JDAAE.JCCCKK..GBBH..G..H",13],[".JFFHC.J..HCDAAIHCDG.IEEDG.BBB....KK",13],["..GGDD....K...AAKCIIEEKCBBHFFJ..H..J",13],["..EKGGLLEKD.J.AAD.J..HHHBBCCCI.FFMMI",14],["MM..D.FFEEDHGAA.DHG.IBKKJJIB..LL..CC",14],["HH.KK.DD.F..AA.F.GCCCEEGMIIBBBMJJ.LL",14],["LJ.FF.LJHHEEAAKB..GCKB..GCIID.....D.",14],["GGEJ....EJDDCAAK..C..KB.IIHHB...LLFF",14],["..DLCCEEDLFG..AAFG.KKBJG..IBJ...IBHH",14],[".H.FF..HGGJLAA.DJL.IID..CEKKBBCE....",14],["KJJCBEK.DCBEAAD..H.GGFFH..L.II..L...",14],["..JJ.E.KKFFEAAC..EDDCL..GBCL..GBIIHH",14],["..IDDDG.IHHHGAAEFCKBBEFCKL.J...L.J..",14],[".E.BDD.ECB...ECAAI..F..IJJF..H.GG..H",14],["M.DDDLM.E..LAAE.J..CCCJFHIGGGFHIBBKK",15],["....DHLLK.DHAAK..I.CBB.I.C.GFF.EEGJJ",15],["GGKH..FEKHCCFEAA.D.EL..D..LIIJ.BBB.J",15],["KBIICCKBHLDDAAHL....FFFE.GGJJE......",15],["....K.FH..K.FHAAK.I.DDD.IEEJCCBB.JGG",15],[".B.HII.B.H...BAAKCGG.DKC...DFE..JJFE",15],["E.DCKKE.DC..AAD.BHJ...BHJIII.F..GG.F",15],["IIGGG..CCCHFAAB.HFE.B..FE.B.DD......",15],[".BBBKK...HHG.AA.DGJJJFDG..CFEELLCII.",16],["FJKKDDFJCG..AACG...B.III.BLLH.EE..H.",16],[".KK.IIBBCDD.AACE..G.CEJJGLL.H.FF..H.",16],["DDFFF..J..I..JAAI.EEG.KK..GBBCHHH..C",16],["EBB...EHH..LAAIF.L..IF.GDJJKKGD.CC..",17],["H.GDBBH.GDF..AADFI.KKK.I.CCCEE.JJ...",17],["EEHHHF..GDDFAAGJCI..KJCI..KJBB......",19],["KEEIFHKG.IFH.GAA.HDJJC..D..CBBD.....",19],["FE.HGGFEKHCC.EKAAD..L..DIIL..J.BBB.J",21],["MMECJJGGECF.DBAAF.DB...LDIIHHLKK....",21],["DDDFF...H.GGAAH.JI.EEEJIB...CCB.....",24],["EEJG.DB.JG.DBAAMHD.K.MH.CK.LL.CIIIFF",25],["GHHBFFGLLBM.GAAEM.CCIEM...IJJD.KK..D",27],["HBBDF.H..DF.AAGD....GKKKCCCEEI..JJ.I",30]];
const KEY='saida-livre-v1';
const COLORS=['#2f7fd8','#22a06b','#f0a202','#8b5cf6','#0fb5ae','#ef6f9c','#6b7a8f','#c97b2d','#4c9f38','#3d5a80','#5b8c85','#a0522d','#17a2b8','#9c6ade'];
let prog={stars:{}};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.stars)prog=s}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(prog))}catch(e){}};
const firstOpen=()=>{let i=0;while(i<LEVELS.length&&prog.stars[i])i++;return Math.min(i,LEVELS.length-1)};
const $=id=>document.getElementById(id);
const board=$('board');
let P=[],pos=[],hist=[],moves=0,cur=0,won=false,ghost;

function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));window.scrollTo(0,0)}
const TIERS={0:'Fácil',20:'Médio',40:'Difícil',60:'Expert'};
function menu(){
  const g=$('grid');g.innerHTML='';const open=firstOpen();
  LEVELS.forEach((_,i)=>{
    if(TIERS[i]){const t=document.createElement('div');t.className='tier';t.textContent=TIERS[i];g.appendChild(t)}
    const b=document.createElement('button');b.className='lv'+(i===open&&!prog.stars[i]?' next':'');
    const st=prog.stars[i]||0;
    b.innerHTML=(i+1)+'<small>'+'★'.repeat(st)+'</small>';
    if(i>open&&!prog.stars[i])b.disabled=true;
    b.onclick=()=>start(i);g.appendChild(b);
  });
  $('cont').textContent=Object.keys(prog.stars).length?'Continuar nível '+(open+1):'Jogar';
  show('menu');
}
$('cont').onclick=()=>start(firstOpen());
$('back').onclick=menu;

function parse(str){
  const m={};for(let i=0;i<36;i++){const c=str[i];if(c!=='.')(m[c]=m[c]||[]).push(i)}
  return Object.keys(m).sort().map(k=>{const c=m[k],r=Math.floor(c[0]/6),col=c[0]%6;
    return Math.floor(c[1]/6)===r?{o:'h',fx:r,v:col,L:c.length}:{o:'v',fx:col,v:r,L:c.length}});
}
function grid(s,skip){const g=new Array(36).fill(false);
  P.forEach((p,i)=>{if(i===skip)return;for(let k=0;k<p.L;k++){const r=p.o==='h'?p.fx:s[i]+k,c=p.o==='h'?s[i]+k:p.fx;g[r*6+c]=true}});return g}
const cellFree=(g,p,x)=>g[p.o==='h'?p.fx*6+x:x*6+p.fx];
function range(i){const p=P[i],g=grid(pos,i);let lo=pos[i],hi=pos[i];
  while(lo-1>=0&&!cellFree(g,p,lo-1))lo--;while(hi+p.L<6&&!cellFree(g,p,hi+p.L))hi++;return[lo,hi]}
const tf=(p,v,px)=>p.o==='h'?`translateX(calc(${v*100/p.L}% + ${px||0}px))`:`translateY(calc(${v*100/p.L}% + ${px||0}px))`;

function start(i){
  cur=i;won=false;moves=0;hist=[];P=parse(LEVELS[i][0]);pos=P.map(p=>p.v);
  $('title').textContent='Nível '+(i+1);$('par').textContent=LEVELS[i][1];
  board.innerHTML='';ghost=document.createElement('div');ghost.className='ghost';board.appendChild(ghost);
  P.forEach((p,k)=>{
    const e=document.createElement('div');e.className='car '+p.o+(p.L===3?' t':'')+(k===0?' player':'');
    const s=100/6+'%',l=p.L*100/6+'%';
    Object.assign(e.style,p.o==='h'?{top:p.fx*100/6+'%',width:l,height:s}:{left:p.fx*100/6+'%',top:0,width:s,height:l});
    e.style.setProperty('--c',k===0?'var(--red)':COLORS[(k*5+i)%COLORS.length]);
    e.innerHTML='<div class="b"><span class="r"></span><span class="g g1"></span><span class="g g2"></span></div>';
    e.style.transform=tf(p,pos[k]);p.el=e;board.appendChild(e);drag(e,k);
  });
  upd();show('game');
}
function upd(){$('mv').textContent=moves;$('undo').disabled=!hist.length||won}
function clearHint(){P.forEach(p=>p.el.classList.remove('hint'));ghost.style.display='none'}

function drag(e,k){
  let sx,sy,lo,hi,cell,active=false;
  e.addEventListener('pointerdown',ev=>{
    if(won||active)return;active=true;clearHint();
    e.setPointerCapture(ev.pointerId);sx=ev.clientX;sy=ev.clientY;[lo,hi]=range(k);
    if(k===0&&hi===4)hi=6.5;cell=board.clientWidth/6;e.classList.add('drag');
  });
  e.addEventListener('pointermove',ev=>{
    if(!active)return;const p=P[k];const d=(p.o==='h'?ev.clientX-sx:ev.clientY-sy)/cell;
    const v=Math.max(lo,Math.min(hi,pos[k]+d));e.style.transform=tf(p,pos[k],(v-pos[k])*cell);
  });
  const end=ev=>{
    if(!active)return;active=false;e.classList.remove('drag');const p=P[k];
    const d=(p.o==='h'?ev.clientX-sx:ev.clientY-sy)/cell;
    let v=Math.round(Math.max(lo,Math.min(hi,pos[k]+d)));
    if(k===0&&v>4)v=4;
    if(v!==pos[k]){hist.push(pos.slice());pos[k]=v;moves++;try{navigator.vibrate&&navigator.vibrate(8)}catch(_){}}
    e.style.transform=tf(p,pos[k]);upd();
    if(pos[0]===4)win();
  };
  e.addEventListener('pointerup',end);e.addEventListener('pointercancel',end);
}

function win(){
  won=true;upd();const p=P[0];
  setTimeout(()=>{p.el.style.transition='transform .45s ease-in';p.el.style.transform=tf(p,8.5)},120);
  const par=LEVELS[cur][1];const st=moves<=par?3:moves<=par+Math.ceil(par/2)?2:1;
  prog.stars[cur]=Math.max(prog.stars[cur]||0,st);save();
  $('stars').innerHTML=[1,2,3].map(n=>n<=st?'★':'<span class="off">★</span>').join('');
  $('msg').textContent=`Você usou ${moves} movimento${moves>1?'s':''}. O mínimo é ${par}.`+(st<3?' Tente igualar o mínimo para ganhar 3 estrelas.':'');
  const last=cur===LEVELS.length-1;
  $('nextBtn').textContent=last?'Voltar aos níveis':'Próximo nível';
  $('nextBtn').onclick=()=>{$('over').classList.remove('on');last?menu():start(cur+1)};
  $('again').onclick=()=>{$('over').classList.remove('on');start(cur)};
  try{navigator.vibrate&&navigator.vibrate([30,40,60])}catch(_){}
  setTimeout(()=>$('over').classList.add('on'),650);
}

$('undo').onclick=()=>{if(!hist.length||won)return;clearHint();pos=hist.pop();moves++;P.forEach((p,i)=>p.el.style.transform=tf(p,pos[i]));upd()};
$('reset').onclick=()=>start(cur);

function solve(){
  const key=s=>s.join(','),prev=new Map([[key(pos),null]]),q=[pos.slice()];let qi=0;
  while(qi<q.length){const s=q[qi++];
    if(s[0]===4){let k=key(s),m=null;while(prev.get(k)){const x=prev.get(k);m=x.mv;k=x.from}return m}
    const g=grid(s,-1),ks=key(s);
    P.forEach((p,i)=>{const at=x=>g[p.o==='h'?p.fx*6+x:x*6+p.fx];
      for(let x=s[i]-1;x>=0&&!at(x);x--){const n=s.slice();n[i]=x;const nk=key(n);if(!prev.has(nk)){prev.set(nk,{from:ks,mv:[i,x]});q.push(n)}}
      for(let x=s[i]+p.L;x<6&&!at(x);x++){const n=s.slice();n[i]=x-p.L+1;const nk=key(n);if(!prev.has(nk)){prev.set(nk,{from:ks,mv:[i,n[i]]});q.push(n)}}
    });
  }return null;
}
$('hint').onclick=()=>{if(won)return;clearHint();const m=solve();if(!m)return;const[i,v]=m,p=P[i];
  p.el.classList.add('hint');const s=100/6+'%',l=p.L*100/6+'%';
  ghost.style.cssText='';Object.assign(ghost.style,p.o==='h'?{top:p.fx*100/6+'%',left:v*100/6+'%',width:l,height:s}:{left:p.fx*100/6+'%',top:v*100/6+'%',width:s,height:l});
  ghost.style.display='block';};
menu();
</script></body></html>
